name: clickhouse-cluster

x-keeper: &keeper
  image: clickhouse/clickhouse-server:26.8
  command: clickhouse keeper --config-file=/etc/clickhouse-keeper/keeper.xml

x-ch: &ch
  image: clickhouse/clickhouse-server:26.8
  depends_on: [keeper1, keeper2, keeper3]
  ulimits:
    nofile:
      soft: 262144
      hard: 262144

services:
  keeper1:
    <<: *keeper
    environment: [KEEPER_ID=1]
    volumes:
      - ./config/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
      - keeper1-data:/var/lib/clickhouse-keeper
  keeper2:
    <<: *keeper
    environment: [KEEPER_ID=2]
    volumes:
      - ./config/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
      - keeper2-data:/var/lib/clickhouse-keeper
  keeper3:
    <<: *keeper
    environment: [KEEPER_ID=3]
    volumes:
      - ./config/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
      - keeper3-data:/var/lib/clickhouse-keeper

  ch-s1-r1:
    <<: *ch
    environment: [SHARD=1, REPLICA=ch-s1-r1]
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s1-r1-data:/var/lib/clickhouse
  ch-s1-r2:
    <<: *ch
    environment: [SHARD=1, REPLICA=ch-s1-r2]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s1-r2-data:/var/lib/clickhouse
  ch-s1-r3:
    <<: *ch
    environment: [SHARD=1, REPLICA=ch-s1-r3]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s1-r3-data:/var/lib/clickhouse
  ch-s2-r1:
    <<: *ch
    environment: [SHARD=2, REPLICA=ch-s2-r1]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s2-r1-data:/var/lib/clickhouse
  ch-s2-r2:
    <<: *ch
    environment: [SHARD=2, REPLICA=ch-s2-r2]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s2-r2-data:/var/lib/clickhouse
  ch-s2-r3:
    <<: *ch
    environment: [SHARD=2, REPLICA=ch-s2-r3]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users-network.xml:/etc/clickhouse-server/users.d/zz-network.xml:ro
      - ch-s2-r3-data:/var/lib/clickhouse

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  ch-s1-r1-data:
  ch-s1-r2-data:
  ch-s1-r3-data:
  ch-s2-r1-data:
  ch-s2-r2-data:
  ch-s2-r3-data:
